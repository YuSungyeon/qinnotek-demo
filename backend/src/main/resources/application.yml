server:
  port: 8080
  # nginx 리버스 프록시 뒤에서 원본 스킴(https)을 인식
  forward-headers-strategy: framework

spring:
  application:
    name: photo-submission
  servlet:
    multipart:
      # 문서(스캔 PDF 등)는 이미지보다 큰 경우가 있어 여유를 둔다. 항목별 검사는 app.upload.max-*-bytes
      max-file-size: 30MB
      max-request-size: 32MB
  # 기본 프로필: 로컬/데모용 H2 인메모리 DB (설정 없이 바로 실행 가능)
  datasource:
    url: jdbc:h2:mem:photodb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration)만 바꾼다. Hibernate 는 엔티티와 DB 가 맞는지 검사만 하고,
      # 어긋나면 앱이 기동하지 않는다. update 로 되돌리지 말 것 (db/migration/README.md)
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 기동 시 JPA 보다 먼저 db/migration/V*.sql 중 미적용분을 순서대로 실행
    locations: classpath:db/migration

# ---- 헬스체크 (Actuator) ----
# GET /actuator/health → {"status":"UP"} (200) / DOWN 이면 503
#  - 외부 가동 모니터링(UptimeRobot 등)과 배포 워크플로의 기동 확인이 이 주소를 본다.
#  - 포함 항목: db(쿼리 가능 여부), diskSpace, uploadStorage(업로드 폴더 쓰기 가능 여부, UploadStorageHealthIndicator)
#  - 세부 내용(디스크 용량, DB 종류 등)은 외부에 보이지 않게 숨긴다. 서버 안에서 확인할 때는 로그를 본다.
#  - health 외 Actuator 엔드포인트(env, beans 등)는 내부 정보가 많아 웹에 노출하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness, /actuator/health/readiness (프로세스 생존 / 요청 받을 준비)
      probes:
        enabled: true
  health:
    diskspace:
      # 업로드 폴더가 있는 디스크를 본다. 남은 용량이 threshold 보다 작으면 DOWN (파일 업로드가 곧 실패할 상태)
      path: ${app.upload.dir}
      threshold: 500MB

# 파일 저장 설정
app:
  upload:
    dir: ./uploads
    max-image-bytes: 20MB
    max-document-bytes: 30MB
  # NAS 기업별 보관 폴더 - {dir}/{기업명}/{요청자료명}.{확장자}. 서버에 마운트한 경로. 비어있으면 끔
  # 예) 리눅스 /mnt/nas/제출자료, 윈도우 Z:/제출자료 또는 //nas/share/제출자료
  archive:
    dir: ${ARCHIVE_DIR:}
  # ClamAV 바이러스 검사 (DEPLOY.md "바이러스 검사"). 켜면 clamd 가 응답하지 않을 때 업로드를 막는다
  virus-scan:
    enabled: ${VIRUS_SCAN_ENABLED:false}
    host: ${CLAMD_HOST:localhost}
    port: ${CLAMD_PORT:3310}
  document:
    # 비어있으면 SOFFICE_BIN 환경변수 → 관례적 경로 순으로 자동 탐지
    soffice-bin: ${SOFFICE_BIN:}
    convert-timeout-sec: ${DOC_CONVERT_TIMEOUT_SEC:90}
    convert-concurrency: ${DOC_CONVERT_CONCURRENCY:1}
    # 문서 자동 분류 임계값 (운영 중 조정 가능)
    abstain-score: 0.8
    low-score: 2.0
    low-margin: 0.8
  # 고객이 접속하는 프론트엔드 주소. 문자로 보내는 제출 링크(= 이 주소 + /s/토큰)를 서버가 이 값으로 만든다
  public-url: ${PUBLIC_URL:http://localhost:5173}
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:4173"
  sms:
    enabled: ${SMS_ENABLED:false}
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender-number: ${SOLAPI_SENDER:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

---
# 운영(EC2 + MySQL) 프로필: --spring.profiles.active=prod 로 실행
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:photodb}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    # Flyway 도입 전부터 테이블이 있던 운영 DB 를 위한 설정.
    # 이력 테이블(flyway_schema_history)이 없고 테이블이 이미 있으면, V1 을 실행하지 않고
    # "V1 적용됨"으로만 기록한 뒤 V2 부터 실행한다. 빈 DB 면 평소처럼 V1 부터 실행한다.
    baseline-on-migrate: true
    baseline-version: 1
    # flyway_schema_history 에 남는 설명. DB 문자셋과 무관하게 깨지지 않도록 영문으로 둔다
    baseline-description: "baseline - existing schema created by ddl-auto update"

app:
  public-url: ${PUBLIC_URL:https://qinnotek.minisub.store}
  upload:
    dir: ${UPLOAD_DIR:/var/app/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://qinnotek.minisub.store}

# 관리자 API 에 로그인이 붙기 전까지 운영에서는 API 명세(Swagger)를 공개하지 않는다.
# 로컬(기본 프로필)에서는 http://localhost:8080/swagger-ui.html 그대로 쓴다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
