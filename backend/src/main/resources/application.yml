server:
  port: 8080
  # nginx 리버스 프록시 뒤에서 원본 스킴(https)을 인식
  forward-headers-strategy: framework

spring:
  application:
    name: photo-submission
  servlet:
    multipart:
      # 문서(스캔 PDF 등)는 이미지보다 큰 경우가 있어 여유를 둔다. 항목별 검사는 app.upload.max-*-bytes
      max-file-size: 30MB
      max-request-size: 32MB
  # 기본 프로필: 로컬/데모용 H2 인메모리 DB (설정 없이 바로 실행 가능)
  datasource:
    url: jdbc:h2:mem:photodb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# 파일 저장 설정
app:
  upload:
    dir: ./uploads
    max-image-bytes: 20MB
    max-document-bytes: 30MB
  document:
    # 비어있으면 SOFFICE_BIN 환경변수 → 관례적 경로 순으로 자동 탐지
    soffice-bin: ${SOFFICE_BIN:}
    convert-timeout-sec: ${DOC_CONVERT_TIMEOUT_SEC:90}
    convert-concurrency: ${DOC_CONVERT_CONCURRENCY:1}
    # 문서 자동 분류 임계값 (운영 중 조정 가능)
    abstain-score: 0.8
    low-score: 2.0
    low-margin: 0.8
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:4173"
  sms:
    enabled: ${SMS_ENABLED:false}
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender-number: ${SOLAPI_SENDER:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

---
# 운영(EC2 + MySQL) 프로필: --spring.profiles.active=prod 로 실행
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:photodb}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

app:
  upload:
    dir: ${UPLOAD_DIR:/var/app/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://qinnotek.minisub.store}
