name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {} # 수동 실행 허용

env:
  # 저장소 Variable(EC2_HOST)에 Elastic IP를 넣으면 IP 변경 시 코드 수정 불필요
  EC2_HOST: ${{ vars.EC2_HOST }}
  EC2_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 테스트가 하나라도 실패하면 여기서 멈추고 배포하지 않는다
      - name: Test & build bootJar
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew clean test bootJar

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/build/libs/app.jar
          target: /home/ubuntu
          strip_components: 3

      - name: Deploy & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # SMS 설정을 원격 스크립트로 전달 (Secret/Variable → 서버 env 파일에 주입)
          envs: SMS_ENABLED,SOLAPI_API_KEY,SOLAPI_API_SECRET,SOLAPI_SENDER
          script: |
            set -e
            sudo mv /home/ubuntu/app.jar /opt/photo-submission/app.jar

            # /etc/photo-submission.env 에 SMS 관련 키 upsert (설정된 값이 있을 때만)
            ENV_FILE=/etc/photo-submission.env
            upsert() {
              local key="$1" val="$2"
              [ -z "$val" ] && return 0
              if sudo grep -q "^${key}=" "$ENV_FILE"; then
                sudo sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
              else
                echo "${key}=${val}" | sudo tee -a "$ENV_FILE" >/dev/null
              fi
            }
            upsert SMS_ENABLED "$SMS_ENABLED"
            upsert SOLAPI_API_KEY "$SOLAPI_API_KEY"
            upsert SOLAPI_API_SECRET "$SOLAPI_API_SECRET"
            upsert SOLAPI_SENDER "$SOLAPI_SENDER"

            # 문서 → PDF 변환기 확인 (설치는 배포를 막지 않도록 자동으로 하지 않는다)
            command -v soffice >/dev/null \
              || echo "경고: LibreOffice 미설치 - 문서는 원본만 저장됩니다. deploy/libreoffice-setup.sh 를 실행하세요."

            sudo systemctl restart photo-submission

            # 기동 확인: 프로세스가 떠 있는지(is-active)가 아니라 실제로 요청을 받을 수 있는지 본다.
            # /actuator/health 가 200(UP)이 될 때까지 최대 120초 기다린다.
            # Flyway 마이그레이션 실패나 스키마 검사(ddl-auto:validate) 실패로 앱이 뜨지 못하면
            # 여기서 배포를 실패로 표시하고, 원인을 볼 수 있게 최근 로그를 남긴다.
            for i in $(seq 1 60); do
              if curl -sf -o /dev/null http://127.0.0.1:8080/actuator/health; then
                echo "헬스체크 UP (${i}회째 확인)"
                echo "배포 완료: $(date)"
                exit 0
              fi
              sleep 2
            done
            echo "::error::앱이 120초 안에 UP 이 되지 않았습니다. 최근 로그:"
            sudo journalctl -u photo-submission -n 80 --no-pager || true
            curl -s http://127.0.0.1:8080/actuator/health || true
            exit 1
        env:
          SMS_ENABLED: ${{ vars.SMS_ENABLED }}
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_SENDER: ${{ vars.SOLAPI_SENDER }}
